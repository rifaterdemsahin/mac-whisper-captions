<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Mac Whisper Captions</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #222; color: #fff; }
        .nav { background: #333; padding: 15px 20px; display: flex; gap: 20px; }
        .nav a { color: #fff; text-decoration: none; font-weight: bold; }
        .nav a:hover { color: #4CAF50; }
        .container { padding: 20px; max-width: 800px; margin: 0 auto; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        #status { padding: 10px; border-radius: 5px; font-weight: bold; }
        .connected { background: #2ecc71; color: #000; }
        .disconnected { background: #e74c3c; color: #fff; }
        .controls { background: #333; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 15px; align-items: center;}
        .controls label { display: flex; flex-direction: column; font-size: 14px; gap: 5px;}
        select, input[type="color"], input[type="range"] { cursor: pointer; }
        
        #subtitles-container {
            background-image: linear-gradient(45deg, #333 25%, transparent 25%), linear-gradient(-45deg, #333 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #333 75%), linear-gradient(-45deg, transparent 75%, #333 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        #subtitles { 
            background: rgba(0, 0, 0, 0.8); 
            padding: 20px; 
            border-radius: 10px; 
            min-height: 150px; 
            font-size: 32px;
            color: #ffffff;
            text-align: center; 
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .subtitle-line { margin: 5px 0; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #log { background: #111; padding: 15px; border-radius: 5px; height: 150px; overflow-y: auto; font-family: monospace; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="index.html">Home</a>
        <a href="test.html">Test Stream</a>
    </div>

    <div class="container">
        <h1>Caption Stream Tester</h1>
        
        <div class="status-bar">
            <div id="status" class="disconnected">Disconnected</div>
            <p style="color: #aaa; font-size: 14px;">Make sure your terminal has Microphone permissions!</p>
        </div>
        
        <div class="controls">
            <label>Microphone
                <select id="mic-select" onchange="changeMic(this.value)">
                    <option value="">Waiting for server...</option>
                </select>
            </label>
            <label>Font Size
                <input type="range" min="16" max="72" value="32" oninput="document.getElementById('subtitles').style.fontSize = this.value + 'px'">
            </label>
            <label>Text Color
                <input type="color" value="#ffffff" oninput="document.getElementById('subtitles').style.color = this.value">
            </label>
            <label>Background Opacity
                <input type="range" min="0" max="1" step="0.1" value="0.8" oninput="updateBgAlpha(this.value)">
            </label>
        </div>

        <div class="controls" style="background: #2a2a35; border: 1px solid #4CAF50;">
            <div style="width: 100%; display: flex; align-items: center; justify-content: space-between;">
                <div>
                    <h3 style="margin: 0 0 5px 0; display: flex; align-items: center; gap: 8px;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4CAF50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg>
                        OBS Browser Source URL
                    </h3>
                    <p style="margin: 0; font-size: 14px; color: #aaa;">In OBS, add a Browser Source. <b style="color: #ff9800;">Uncheck "Local File"</b>, and paste this into the <b>URL</b> box:</p>
                </div>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <select id="obs-theme" onchange="updateObsLink()" style="background: #111; color: #fff; border: 1px solid #333; padding: 10px; border-radius: 5px;">
                        <option value="default">Default Theme</option>
                        <option value="neon">Neon Theme</option>
                        <option value="retro">Retro Theme</option>
                        <option value="minimal">Minimal Theme</option>
                    </select>
                    <input type="text" id="obs-link" readonly value="/Users/rifaterdemsahin/projects/mac-whisper-captions/public/index.html" style="background: #111; color: #4CAF50; border: 1px solid #333; padding: 10px; border-radius: 5px; width: 350px; font-family: monospace;">
                    <button onclick="copyObsLink()" style="background: #4CAF50; color: #000; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer;">Copy</button>
                </div>
            </div>
        </div>

        <h2>Live Subtitles Preview</h2>
        <div id="subtitles-container">
            <div id="subtitles"></div>
        </div>

        <h2>Raw Log</h2>
        <div id="log"></div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const subtitlesEl = document.getElementById('subtitles');
        const logEl = document.getElementById('log');
        const micSelect = document.getElementById('mic-select');
        const MAX_LINES = 3;
        let ws;

        function updateBgAlpha(alpha) {
            subtitlesEl.style.backgroundColor = `rgba(0, 0, 0, ${alpha})`;
        }

        function changeMic(id) {
            if (ws && ws.readyState === 1) {
                ws.send(JSON.stringify({ type: 'change_device', id: id }));
            }
        }

        function connect() {
            statusEl.textContent = 'Connecting...';
            ws = new WebSocket('ws://localhost:3000');

            ws.onopen = () => {
                statusEl.textContent = 'Connected';
                statusEl.className = 'connected';
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === 'devices') {
                    // Update microphone dropdown
                    micSelect.innerHTML = '';
                    data.devices.forEach(dev => {
                        const opt = document.createElement('option');
                        opt.value = dev.id;
                        opt.textContent = `[${dev.id}] ${dev.name}`;
                        if (dev.id === data.current) {
                            opt.selected = true;
                        }
                        micSelect.appendChild(opt);
                    });
                    if (data.devices.length === 0) {
                        micSelect.innerHTML = '<option value="">No devices found</option>';
                    }
                } else if (data.type === 'text') {
                    // Add to subtitles UI
                    const line = document.createElement('div');
                    line.className = 'subtitle-line';
                    line.textContent = data.text;
                    subtitlesEl.appendChild(line);
                    while (subtitlesEl.children.length > MAX_LINES) {
                        subtitlesEl.removeChild(subtitlesEl.firstChild);
                    }

                    // Add to raw log
                    const logLine = document.createElement('div');
                    logLine.textContent = `[${new Date().toLocaleTimeString()}] ${data.text}`;
                    logEl.appendChild(logLine);
                    logEl.scrollTop = logEl.scrollHeight;
                }
            };

            ws.onclose = () => {
                statusEl.textContent = 'Disconnected (Retrying...)';
                statusEl.className = 'disconnected';
                micSelect.innerHTML = '<option value="">Waiting for server...</option>';
                setTimeout(connect, 2000);
            };
            
            ws.onerror = () => ws.close();
        }

        function updateObsLink() {
            const theme = document.getElementById('obs-theme').value;
            const input = document.getElementById('obs-link');
            const basePath = 'file:///Users/rifaterdemsahin/projects/mac-whisper-captions/public/index.html';
            if (theme === 'default') {
                input.value = basePath;
            } else {
                input.value = `${basePath}?theme=${theme}`;
            }
        }

        function copyObsLink() {
            const input = document.getElementById('obs-link');
            
            // Because OBS on Mac can sometimes be finicky with absolute paths vs file URIs in Local File mode,
            // we will provide the clean file:/// URI. Wait, actually OBS Local File expects a raw path.
            // But with URL parameters (like ?theme=neon), OBS "Local File" checkbox strips them on some versions!
            // The safest way is to uncheck "Local File" in OBS and put the file:/// URI in the "URL" box.
            
            input.select();
            document.execCommand('copy');
            const btn = input.nextElementSibling;
            const originalText = btn.textContent;
            btn.textContent = 'Copied!';
            setTimeout(() => btn.textContent = originalText, 2000);
        }

        // Initialize link correctly
        updateObsLink();
        connect();
    </script>
</body>
</html>
